name: Helm Chart Validation

on:
  pull_request:
    paths:
      - "helm/**"
  push:
    branches:
      - main
    paths:
      - "helm/**"

jobs:
  helm-lint-and-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helm/shopwave-microservice

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.2.4"

      - name: helm lint
        run: helm lint .

      - name: helm template - every service values file
        run: |
          set -euo pipefail
          for values_file in values-*.yaml; do
            service_name="${values_file#values-}"
            service_name="${service_name%.yaml}"
            echo "== helm template: $service_name ($values_file) =="
            helm template "shopwave-$service_name" . -f values.yaml -f "$values_file"
          done
