openapi: 3.0.3
info:
  title: ShopWave API
  description: >
    Unified API documentation for the ShopWave microservices platform,
    served centrally through the API Gateway. Each tag below corresponds
    to a distinct backend microservice; the Gateway proxies requests to
    the appropriate service based on path prefix.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local API Gateway (dev)

tags:
  - name: Auth
    description: Auth Service (port 3001) — JWT issuance and session handling
  - name: User
    description: User Service (port 3004) — registration and profile data
  - name: Cart
    description: Cart Service (port 3005) — Redis-backed shopping cart
  - name: Order
    description: Order Service (port 3006) — checkout and order lifecycle
  - name: Payment
    description: Payment Service (port 3008) — payment processing

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived JWT access token
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        firstName:
          type: string
        lastName:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string

    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: float

    Cart:
      type: object
      properties:
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float

    CheckoutRequest:
      type: object
      required: [userId, items, shippingAddressId]
      properties:
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        shippingAddressId:
          type: string
        discountCode:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]
        total:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time

    ChargeRequest:
      type: object
      required: [orderId, amount, paymentMethodId]
      properties:
        orderId:
          type: string
        amount:
          type: number
          format: float
        paymentMethodId:
          type: string
          description: Stripe/PayPal payment method token

    ChargeResponse:
      type: object
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, FAILED]

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user and issue a JWT
      description: >
        Rate-limited to 15 requests per 15 minutes per IP+email at the
        Gateway layer to mitigate brute-force login attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/register:
    post:
      tags: [User]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/profile:
    get:
      tags: [User]
      summary: Fetch the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cart/{userId}:
    get:
      tags: [Cart]
      summary: Get the current cart for a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user's cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/{userId}/items:
    post:
      tags: [Cart]
      summary: Add an item to the user's cart
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /orders/checkout:
    post:
      tags: [Order]
      summary: Submit a new order from the current cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created (PENDING, awaiting payment confirmation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Stock reservation failed for one or more items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}:
    get:
      tags: [Order]
      summary: Fetch a single order by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/charge:
    post:
      tags: [Payment]
      summary: Charge a payment method for a given order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '200':
          description: Charge processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'
        '402':
          description: Charge declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
