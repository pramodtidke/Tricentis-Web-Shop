# ArgoCD Application: shopwave-cart-service
# Copied from shopwave-api-gateway.yaml pattern, pointing at values-cart-service.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopwave-cart-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pramodtidke/Tricentis-Web-Shop.git
    targetRevision: main
    path: helm/shopwave-microservice
    helm:
      valueFiles:
        - values-cart-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shopwave
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m