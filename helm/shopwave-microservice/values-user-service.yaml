replicaCount: 1

image:
  repository: ghcr.io/pramodtidke/tricentis-web-shop/shopwave-user-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 3004

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

env:
  - name: NODE_ENV
    value: "production"
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: user-service-secrets
        key: db-host
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: user-service-secrets
        key: db-port
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: user-service-secrets
        key: db-name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: user-service-secrets
        key: db-user
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: user-service-secrets
        key: db-password

