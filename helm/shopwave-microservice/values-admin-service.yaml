replicaCount: 2

image:
  repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/shopwave-admin-service"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 3015

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: production
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: admin-service-secrets
        key: db-host
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: admin-service-secrets
        key: db-port
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: admin-service-secrets
        key: db-name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: admin-service-secrets
        key: db-user
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: admin-service-secrets
        key: db-password
