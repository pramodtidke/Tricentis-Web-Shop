replicaCount: 2

image:
  repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/shopwave-catalog-service"
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 3002

service:
  port: 80

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: production
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        name: catalog-service-secrets
        key: mongo-uri
