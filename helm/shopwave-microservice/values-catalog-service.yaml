replicaCount: 2

image:
  repository: ghcr.io/pramodtidke/tricentis-web-shop/shopwave-catalog-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 3002

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: production
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        name: catalog-service-secrets
        key: mongo-uri

