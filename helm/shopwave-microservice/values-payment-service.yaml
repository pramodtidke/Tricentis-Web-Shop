replicaCount: 1

image:
  repository: ghcr.io/pramodtidke/tricentis-web-shop/shopwave-payment-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 3008

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

env:
  - name: NODE_ENV
    value: production
  - name: ORDER_SERVICE_URL
    value: "http://shopwave-order-service-shopwave-microservice:80"
  - name: USER_SERVICE_URL
    value: "http://shopwave-user-service-shopwave-microservice:80"
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: payment-service-secrets
        key: db-host
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: payment-service-secrets
        key: db-port
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: payment-service-secrets
        key: db-name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: payment-service-secrets
        key: db-user
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: payment-service-secrets
        key: db-password
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: payment-service-secrets
        key: rabbitmq-url

