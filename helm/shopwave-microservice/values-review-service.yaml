replicaCount: 1

image:
  repository: ghcr.io/pramodtidke/tricentis-web-shop/shopwave-review-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 3009

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

env:
  - name: NODE_ENV
    value: production
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        name: review-service-secrets
        key: mongo-uri

