apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopwave-microservice.fullname" . }}
  labels:
    {{- include "shopwave-microservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "shopwave-microservice.selectorLabels" . | nindent 4 }}
