replicaCount: 2

image:
  repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/shopwave-search-service"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  containerPort: 3011

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: production
  - name: ELASTICSEARCH_URL
    value: "http://elasticsearch:9200"
