apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopwave
  labels:
    app: api-gateway
spec:
  type:
    ClusterIP # internal-only for now; swap to LoadBalancer (or add an Ingress)
    # once we're ready to expose this beyond the cluster
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
