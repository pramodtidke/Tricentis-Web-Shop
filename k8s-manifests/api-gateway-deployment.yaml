apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopwave
  labels:
    app: api-gateway
    domain: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          # TODO: replace with real ECR image URI once the container
          # registry pipeline exists (currently images are local-only,
          # built via docker-compose per the Day 16-19 workflow).
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/shopwave/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
